<title>Mahalla xizmatlari</title>
<style>

:root{--pri:#16a34a;--pri2:#15803d;--soft:#dcfce7;--bg:#f2f5f3;--card:#fff;--txt:#101828;
--mut:#667085;--line:#e4e7ec;--red:#d92d20;--amber:#f59e0b;
--sh:0 1px 2px rgba(16,24,40,.05),0 8px 20px rgba(16,24,40,.07)}
@media(prefers-color-scheme:dark){:root{--soft:#12301e;--bg:#0a0e0c;--card:#141917;--txt:#f2f4f7;
--mut:#98a2b3;--line:#252c28;--sh:0 0 0 1px #1e2521}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
color:var(--txt);line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom));
-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{flex:none;vertical-align:middle}
.app{max-width:560px;margin:0 auto}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bar h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{color:#fff;display:flex;padding:6px;margin-left:-8px;border-radius:50%;text-decoration:none}
.ib:active{background:rgba(255,255,255,.18)}
main{padding:14px 16px;animation:in .28s ease both}main.flush{padding:0}.pad{padding:14px 16px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}
.hero{position:relative;overflow:hidden;color:#fff;padding:18px 16px 26px;
padding-top:calc(18px + env(safe-area-inset-top));border-radius:0 0 30px 30px;
background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.22),transparent 38%),
radial-gradient(circle at 5% 100%,rgba(0,0,0,.16),transparent 45%),
linear-gradient(135deg,var(--pri2),var(--pri))}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}
.brand .mk{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);
display:flex;align-items:center;justify-content:center}
.hero h2{font-size:26px;line-height:1.18;margin:16px 0 6px;letter-spacing:-.4px}
.hero p{margin:0 0 16px;opacity:.9;font-size:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--mut);
border-radius:16px;padding:0 15px;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.search input{border:0;background:transparent;margin:0;padding:15px 0;color:var(--txt);border-radius:0}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card p{margin:8px 0}
.center{text-align:center}
input,select,textarea{width:100%;padding:14px;border:1.5px solid var(--line);background:var(--card);
color:var(--txt);border-radius:14px;font:inherit;font-size:16px;margin:6px 0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
textarea{min-height:96px;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin-top:10px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
border:0;border-radius:14px;background:var(--pri2);color:#fff;font:inherit;font-weight:700;
font-size:16px;text-decoration:none;cursor:pointer;margin:6px 0;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.93)}
.btn:disabled,.btn.off{opacity:.55;pointer-events:none}
.btn.sm{display:inline-flex;width:auto;padding:9px 16px;font-size:14px;border-radius:99px;margin:0}
.btn.ghost{background:var(--soft);color:var(--pri2)}
@media(prefers-color-scheme:dark){.btn.ghost{color:#86efac}}
.btn.red{background:var(--red)}
.btn.line{background:transparent;color:var(--txt);border:1.5px solid var(--line)}
.btn.dline{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.row{display:flex;gap:8px}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.between>*{flex:none}
.g8{display:flex;align-items:center;gap:10px}
.muted{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;
background:var(--card);border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:600}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.sortlnk{font-size:13px;color:var(--mut)}.sortlnk a{text-decoration:none;font-weight:600}
.sortlnk a.on{color:var(--pri)}
.av{flex:none;width:54px;height:54px;border-radius:17px;display:flex;align-items:center;
justify-content:center;color:#fff;font-weight:800;font-size:18px}
.av.lg{width:84px;height:84px;border-radius:27px;font-size:31px;margin:0 auto 10px}
.av.sm{width:42px;height:42px;border-radius:13px;font-size:15px}
.mc{display:flex;gap:12px;text-decoration:none;color:inherit;transition:transform .1s}
.mc:active{transform:scale(.985)}
.mc .info{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:5px}
.ver{color:var(--pri);display:flex}
.cat{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:13px;margin-top:6px}
.meta span{display:flex;align-items:center;gap:4px}
.star,.stars{color:var(--amber);display:inline-flex;align-items:center}
.stars{gap:1px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.dot.busy{background:#98a2b3}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-size:16px}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:#fef3c7;color:#92400e}.st-accepted{background:#dbeafe;color:#1e40af}
.st-done{background:#dcfce7;color:#166534}.st-cancelled{background:#fee2e2;color:#991b1b}
.steps{display:flex;margin:14px 0 6px}
.stp{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative}
.stp i{display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 5px;position:relative;z-index:1}
.stp+.stp::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.stp.on i,.stp.on::before{background:var(--pri)}
.stp.on{color:var(--txt);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg a,.seg label{flex:1;text-align:center;border-radius:11px;font-weight:600;font-size:14px;color:var(--mut);text-decoration:none;cursor:pointer}
.seg a{padding:10px}.seg label span{display:block;padding:10px;border-radius:11px}
.seg label{position:relative}.seg input{position:absolute;opacity:0;pointer-events:none}.seg input:focus-visible+span{outline:2px solid var(--pri);outline-offset:1px}
.seg a.on,.seg input:checked+span{background:var(--card);color:var(--txt);box-shadow:var(--sh)}
.stats{display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.stats div{flex:1}.stats b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px}
.stats div>span{font-size:12px;color:var(--mut)}
.rev{padding:12px 0;border-top:1px solid var(--line)}.rev:first-of-type{border-top:0}
.stick{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:10}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .ci{width:76px;height:76px;border-radius:50%;background:var(--soft);color:var(--pri);

.empty b{color:var(--txt);display:block;font-size:16px}
.earn{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.earn b{font-size:28px;display:block;letter-spacing:-.5px}.earn .muted{color:rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:19px}.stat span{color:var(--mut);font-size:12px}
.warn{display:flex;gap:10px;align-items:flex-start;background:#fef3c7;color:#78350f;border-radius:16px;
padding:12px 14px;margin-bottom:12px;font-size:14px}
.warn a{font-weight:700}
.rate{display:flex;flex-direction:row-reverse;justify-content:center;gap:2px;margin:6px 0}
.rate input{position:absolute;opacity:0;pointer-events:none}.rate input:focus-visible+label{outline:2px solid var(--pri);border-radius:8px}
.rate label{line-height:1;color:var(--line);cursor:pointer;padding:0 3px}
.rate label svg{width:38px;height:38px}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--amber)}
.auth{text-align:center;padding:14px 0 8px}
.logo-lg{width:84px;height:84px;margin:0 auto 12px;border-radius:26px;color:#fff;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 10px 26px rgba(22,163,74,.35)}
.auth h2{margin:6px 0 4px;font-size:22px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.how div{text-align:center;font-size:12px;color:var(--mut)}
.how b{display:block;color:var(--txt);font-size:13px;margin:6px 0 2px}
.how i{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--pri);
display:flex;align-items:center;justify-content:center;margin:0 auto;font-style:normal}
.lnk{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);
text-decoration:none}.lnk:first-child{border-top:0}
.lnk span{display:flex;align-items:center;gap:10px}
.doc h3{margin:18px 0 6px;font-size:16px}.doc p,.doc li{font-size:15px;color:var(--txt)}
.doc ul{padding-left:20px;margin:6px 0}
details.rep{margin-top:6px}details.rep summary{list-style:none;cursor:pointer;color:var(--mut);font-size:13px;
display:flex;align-items:center;gap:6px;padding:6px 0}
details.rep summary::-webkit-details-marker{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;
color:var(--mut);text-decoration:none;font-size:11px;font-weight:600;position:relative}
.tabs a.on{color:var(--pri)}
.tabs a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--pri)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));
max-width:528px;margin:0 auto;background:#101828;color:#fff;padding:13px 16px;border-radius:14px;
font-size:14px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;z-index:60;
box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:none}
.upd{display:flex;align-items:center;gap:10px;background:#fef3c7;color:#78350f;padding:10px 16px;font-size:14px}
.upd span.t{flex:1;font-weight:600}
.upd a.go,.upd button.go{background:#b45309;color:#fff;padding:7px 14px;border-radius:99px;text-decoration:none;font-weight:700;font-size:13px;border:0;font-family:inherit;width:auto;margin:0;cursor:pointer}

.hide{display:none!important}

.upd button.x{width:auto;margin:0;padding:2px;background:none;border:0;color:inherit;cursor:pointer;display:flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill.st-off{background:#e4e7ec;color:#344054}
.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:none}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll a{flex:none;padding:10px 14px;white-space:nowrap}
.filt{display:grid;gap:4px}
.btn.dline{background:transparent}
#app.loading main{opacity:.55;transition:opacity .15s}
#app.wide{max-width:1040px}
#app.wide .tabs .in{max-width:1040px}
.grid.gw{grid-template-columns:1fr 1fr}
@media(min-width:760px){
 .grid.gw{grid-template-columns:repeat(4,1fr)}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
 .filt{grid-template-columns:2fr 1fr 1fr auto;align-items:center;gap:8px}
 .filt .btn{margin:6px 0}
}

/* ============ YORDAMCHILAR ============ */
var S = {commission: '10', contact_email: '', categories: JSON.stringify(DEFAULT_CATS), latest_version: APP_VERSION, update_url: ''};
var CATS = DEFAULT_CATS.slice();
function ic(n, s, sw) {
  s = s || 22; sw = sw || 2;
  var logo = n === 'logo';
  return '<svg width="' + s + '" height="' + s + '" viewBox="' + (logo ? '0 0 48 48' : '0 0 24 24') + '" fill="none" stroke="currentColor" stroke-width="' + (logo ? 3.4 : sw) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
}
function catIc(c, s) { return ic(CAT_ICON[c] || 'tool', s || 18); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function r1(n) { return n == null ? '-' : Number(n).toFixed(1); }
function som(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; }
function initials(n) { return String(n || '?').split(/\s+/).slice(0, 2).map(function (p) { return p.charAt(0); }).join('').toUpperCase(); }
function hue(n) { var h = 0; String(n || '').split('').forEach(function (c) { h += c.charCodeAt(0); }); return h % 360; }
function short(n) { var p = String(n || '').split(/\s+/); return p[0] + (p[1] ? ' ' + p[1].charAt(0) + '.' : ''); }
function phoneFmt(p) { return /^\d{9}$/.test(p) ? '+998 ' + p.slice(0, 2) + ' ' + p.slice(2, 5) + ' ' + p.slice(5, 7) + ' ' + p.slice(7) : String(p || ''); }
function cleanPhone(p) { return String(p || '').replace(/\D/g, '').slice(-9); }
function stars(n, s) { var o = ''; for (var i = 0; i < n; i++) o += ic('star', s || 14); return '<span class="stars" role="img" aria-label="' + n + ' yulduz">' + o + '</span>'; }
function av(n, cls) { return '<div class="av ' + (cls || '') + '" style="background:hsl(' + hue(n) + ' 55% 42%)">' + esc(initials(n)) + '</div>'; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtD(iso) {
  if (!iso) return '-';
  var d = new Date(iso); if (isNaN(d.getTime())) return '-';
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function cmpVer(a, b) {
  var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (var i = 0; i < 3; i++) { var p = x[i] || 0, q = y[i] || 0; if (p !== q) return p > q ? 1 : -1; }
  return 0;
}
function emptyState(icon, title, text, action) {
  return '<div class="empty"><div class="ci">' + ic(icon, 34) + '</div><b>' + title + '</b><p>' + text + '</p>' + (action || '') + '</div>';
}
function toInt(v, d, lo, hi) { var n = parseInt(v, 10); if (isNaN(n)) return d; return Math.max(lo, Math.min(hi, n)); }

/* ============ SESSIYA VA SERVER ============ */
var memToken = '';
function getTok() { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (e) { return memToken; } }
function setTok(t) { memToken = t || ''; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

function api(fn, args) {
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify(args || {})
  }).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) { var er = new Error((j && j.message) || 'Server xatosi. Qayta urinib ko\'ring.'); er.server = true; throw er; }
      return j;
    });
  }, function () { var er = new Error("Internet bilan aloqa yo'q."); er.offline = true; throw er; });
}

var ME = null, meAt = 0;
function me(force) {
  var t = getTok();
  if (!t) { ME = null; return Promise.resolve(null); }
  if (!force && ME && Date.now() - meAt < 20000) return Promise.resolve(ME);
  return api('mhl_me', {p_token: t}).then(function (r) {
    ME = r && r.user ? r.user : null; meAt = Date.now();
    if (!ME) setTok('');
    return ME;
  });
}
function loadSettings() {
  return api('mhl_settings_get').then(function (s) {
    if (s) {
      Object.keys(S).forEach(function (k) { if (s[k] != null) S[k] = s[k]; });
      try { var c = JSON.parse(S.categories); if (c && c.length) CATS = c; } catch (e) {}
    }
  }, function () {});
}
function commissionPct() { var c = parseFloat(S.commission); return isNaN(c) ? 10 : c; }

/* ============ KO'RINISHLAR ============ */
function hq(o) {
  var p = new URLSearchParams();
  Object.keys(o).forEach(function (k) { if (o[k]) p.set(k, o[k]); });
  var s = p.toString();
  return '#/' + (s ? '?' + s : '');
}
function hqa(sec, o) {
  var p = new URLSearchParams();
  Object.keys(o || {}).forEach(function (k) { if (o[k]) p.set(k, o[k]); });
  var s = p.toString();
  return '#/admin/' + sec + (s ? '?' + s : '');
}

function vHome(q, u) {

  return api('mhl_masters_list', {p_category: cat || null, p_q: raw || null, p_sort: sort === 'price' ? 'price' : null}).then(function (rows) {

    var chips = '<a class="chip ' + (!cat ? 'on' : '') + '" href="' + hq({q: raw}) + '">' + ic('grid', 17) + ' Hammasi</a>' +
      CATS.map(function (c) { return '<a class="chip ' + (c === cat ? 'on' : '') + '" href="' + esc(hq({cat: c, q: raw})) + '">' + catIc(c, 17) + ' ' + esc(c) + '</a>'; }).join('');
    var list = rows.map(function (x) {
      return '<a class="card mc" href="#/usta/' + x.id + '">' + av(x.name) +
        '<div class="info"><div class="nm">' + esc(x.name) + (x.jobs >= 3 ? '<span class="ver" title="3 va undan ko\'p bajarilgan ish">' + ic('shield', 17) + '</span>' : '') + '</div>' +

        '<div class="meta"><span class="star">' + ic('star', 15) + '<b style="color:var(--txt)">' + (x.avg != null ? r1(x.avg) : 'Yangi') + '</b></span>' +
        '<span>' + ic('pin', 15) + esc(x.district) + '</span>' +
        '<span><i class="dot ' + (x.available ? '' : 'busy') + '"></i>' + (x.available ? "Bo'sh" : 'Band') + '</span></div>' +
        '<div class="foot"><div><span class="muted">dan</span> <b class="price">' + som(x.price) + '</b></div><span class="btn sm">Ko\'rish</span></div></div></a>';
    }).join('');
    if (!list) {

    return {active: 'home', hideBar: true, flush: true, html:
      '<div class="hero"><div class="brand"><span class="mk">' + ic('logo', 22) + '</span> Mahalla</div>' +
      '<h2>' + (u ? 'Salom, ' + esc(u.name.split(' ')[0]) : 'Ustani mahallangizdan toping') + '</h2>' +

      '<a class="' + (sort !== 'price' ? 'on' : '') + '" href="' + esc(hq({cat: cat, q: raw})) + '">Reyting</a> | ' +

function orderCard(o, u) {
  var step = o.status === 'new' ? 0 : o.status === 'accepted' ? 1 : o.status === 'done' ? 2 : -1;
  var h = '<div class="card"><div class="between"><div class="g8">' + av(o.other_name, 'sm') + '<div><b>' + esc(short(o.other_name)) + '</b><div class="muted">#' + o.id + ' &middot; ' + esc(fmtD(o.created_at)) + '</div></div></div>' +
    '<span class="pill st-' + o.status + '">' + STATUS[o.status] + '</span></div><p>' + esc(o.descr) + '</p>' +
    '<div class="meta"><span>' + ic('pin', 15) + esc(o.addr) + '</span>' + (o.when_text ? '<span>' + ic('clock', 15) + esc(o.when_text) + '</span>' : '') + '<span><b style="color:var(--txt)">' + som(o.price) + '</b></span></div>';
  if (o.status !== 'cancelled') {
    h += '<div class="steps">' + ['Yuborildi', 'Qabul', 'Bajarildi'].map(function (l, i) { return '<div class="stp ' + (i <= step ? 'on' : '') + '"><i></i>' + l + '</div>'; }).join('') + '</div>';
  }
  if (o.other_phone && /^\d{9}$/.test(o.other_phone)) {
    h += '<a class="btn ghost" href="tel:+998' + o.other_phone + '">' + ic('phone', 18) + ' ' + phoneFmt(o.other_phone) + '</a>';
  }
  if (u.role === 'master') {
    if (o.status === 'new') h += '<div class="row"><button class="btn" data-act="accept" data-id="' + o.id + '">Qabul qilish</button><button class="btn line" data-act="cancel" data-id="' + o.id + '">Bekor qilish</button></div>';
    if (o.status === 'accepted') {
      h += '<form data-form="done" data-id="' + o.id + '" style="margin-top:8px"><label class="lbl" for="dn-' + o.id + '">Yakuniy narx (so\'m)</label>' +
        '<input id="dn-' + o.id + '" name="price" type="number" inputmode="numeric" min="1000" value="' + o.price + '" required>' +
        '<div class="row"><button class="btn">Bajarildi</button><button type="button" class="btn line" data-act="cancel" data-id="' + o.id + '">Bekor qilish</button></div></form>';
    }
    if (o.rating) h += '<div class="muted g8" style="margin-top:6px">Baho: ' + stars(o.rating) + (o.review ? ' &middot; "' + esc(o.review) + '"' : '') + '</div>';
  } else {
    if (o.status === 'new') h += '<button class="btn line" data-act="cancel" data-id="' + o.id + '">Bekor qilish</button>';
    else if (o.status === 'done' && o.rating == null) {
      h += '<form data-form="rate" data-id="' + o.id + '" style="margin-top:8px"><div class="lbl center" id="rl-' + o.id + '">Ishdan qoniqdingizmi? Baho bering</div><div class="rate" role="radiogroup" aria-labelledby="rl-' + o.id + '">' +
        [5, 4, 3, 2, 1].map(function (n) { return '<input type="radio" name="rating" id="r' + n + '-' + o.id + '" value="' + n + '" ' + (n === 5 ? 'checked' : '') + '><label for="r' + n + '-' + o.id + '" title="' + n + ' yulduz"><span class="sr">' + n + ' yulduz</span>' + ic('star', 38) + '</label>'; }).join('') +
        '</div><input name="review" placeholder="Fikringiz (ixtiyoriy)" maxlength="500" aria-label="Sharh"><button class="btn">Yuborish</button></form>';
    } else if (o.rating) h += '<div class="muted g8" style="margin-top:6px">Sizning bahoyingiz: ' + stars(o.rating) + '</div>';
  }
  return h + '</div>';
}

function vOrders(q, u) {
  var tab = q.get('tab') === 'history' ? 'history' : 'active';
  return api('mhl_orders_mine', {p_token: getTok()}).then(function (all) {
    all = all || [];
    var sts = tab === 'active' ? ['new', 'accepted'] : ['done', 'cancelled'];
    var orders = all.filter(function (o) { return sts.indexOf(o.status) >= 0; });
    var top = '';
    if (u.role === 'master') {
      var done = all.filter(function (o) { return o.status === 'done'; });
      var earned = Math.round(done.reduce(function (a, o) { return a + o.price; }, 0) * (1 - commissionPct() / 100));
      var rated = all.filter(function (o) { return o.rating != null; });
      var avg = rated.length ? rated.reduce(function (a, o) { return a + o.rating; }, 0) / rated.length : null;
      var av_ = u.master && u.master.available;
      top = '<div class="card earn"><span class="muted">Sof daromad (komissiyadan keyin)</span><b>' + som(earned) + '</b><span class="muted">' + done.length + ' ta bajarilgan ish &middot; reyting ' + r1(avg) + '</span></div>' +
        '<div class="card between"><div class="g8"><i class="dot ' + (av_ ? '' : 'busy') + '"></i><div><b>' + (av_ ? "Hozir bo'shsiz" : 'Hozir bandsiz') + '</b><div class="muted">' + (av_ ? 'Yangi buyurtmalar qabul qilinadi' : 'Yangi buyurtma kelmaydi') + '</div></div></div>' +
        '<button class="btn sm ghost" data-act="avail">' + (av_ ? 'Band qilish' : "Bo'sh qilish") + '</button></div>';
    }
    var empty = u.role === 'client'
      ? emptyState(tab === 'active' ? 'inbox' : 'archive', tab === 'active' ? "Faol buyurtma yo'q" : "Tarix bo'sh", "Kerakli ustani toping va birinchi buyurtmani bering.", '<a class="btn sm" href="#/">Usta qidirish</a>')
      : emptyState(tab === 'active' ? 'inbox' : 'archive', tab === 'active' ? "Faol buyurtma yo'q" : "Tarix bo'sh", "Profilingiz to'liq bo'lsa, mijozlar sizni tezroq topadi.", '<a class="btn sm" href="#/profile">Profilni to\'ldirish</a>');
    return {active: 'orders', title: 'Buyurtmalar', html: top +
      '<div class="seg"><a class="' + (tab === 'active' ? 'on' : '') + '" href="#/orders">Faol</a><a class="' + (tab === 'history' ? 'on' : '') + '" href="#/orders?tab=history">Tarix</a></div>' +
      (orders.map(function (o) { return orderCard(o, u); }).join('') || empty)};
  });
}

  } else if (sec === 'users') {

          (o.rating ? '<div class="muted g8" style="margin-top:6px">' + stars(o.rating) + (o.review ? ' &middot; "' + esc(o.review) + '"' : '') + '</div>' : '') +
          (o.status === 'new' || o.status === 'accepted' ? '<button class="btn sm dline" style="margin-top:10px" data-act="ocancel" data-id="' + o.id + '">Bekor qilish</button>' : '') + '</div>';
      }).join('') || '<p class="muted">Buyurtma yo\'q.</p>') + '</div>';
    });
  } else if (sec === 'reports') {
    p = api('mhl_admin_reports', {p_token: tok}).then(function (rows) {
      rows = rows || [];
      return '<div class="cols">' + (rows.map(function (r) {
        return '<div class="card"><div class="between"><b>' + (r.kind === 'master' ? 'Usta' : 'Sharh') + ': ' + esc(r.target_name || '-') + '</b><span class="muted">#' + r.id + '</span></div>' +
          '<div class="muted">' + esc(r.reason) + ' &middot; ' + esc(short(r.reporter)) + ' &middot; ' + esc(fmtD(r.created_at)) + '</div>' +
          (r.kind === 'review' ? '<p>"' + esc(r.review_text || "(matn yo'q)") + '"</p>' : '') +
          '<div class="row" style="margin-top:8px"><button class="btn red" data-act="rblock" data-id="' + r.id + '">Ustani bloklash</button>' +
          (r.kind === 'review' ? '<button class="btn red" data-act="rclear" data-id="' + r.id + '">Sharhni o\'chirish</button>' : '') +
          '<button class="btn line" data-act="rclose" data-id="' + r.id + '">Yopish</button></div></div>';
      }).join('') || emptyState('checkc', "Ochiq shikoyat yo'q", 'Hammasi joyida.')) + '</div>';
    });
  } else if (sec === 'settings') {
    p = loadSettings().then(function () {
      return '<form class="card" data-form="admsettings"><b>Tizim sozlamalari</b>' +
        '<label class="lbl" for="s-cm">Komissiya (%)</label><input id="s-cm" name="commission" type="number" min="0" max="50" value="' + esc(S.commission) + '" required>' +
        '<label class="lbl" for="s-em">Aloqa email (maxfiylik siyosatida ko\'rinadi)</label><input id="s-em" name="contact_email" type="email" maxlength="100" value="' + esc(S.contact_email) + '" placeholder="email@domen.uz">' +
        '<label class="lbl" for="s-ct">Xizmat turlari (har qatorda bittadan)</label><textarea id="s-ct" name="categories" style="min-height:160px" required>' + esc(CATS.join('\n')) + '</textarea>' +
        '<p class="muted">Yangi tur uchun maxsus ikonka bo\'lmasa, umumiy ikonka ishlatiladi.</p>' +
        '<label class="lbl" for="s-vr">Ilovaning oxirgi versiyasi</label><input id="s-vr" name="latest_version" value="' + esc(S.latest_version) + '" placeholder="1.1.0" required>' +
        '<label class="lbl" for="s-ur">Yangilash havolasi (Play Market yoki APK)</label><input id="s-ur" name="update_url" type="url" maxlength="300" value="' + esc(S.update_url) + '" placeholder="https://...">' +
        '<p class="muted">Versiyani ilovaning joriy versiyasidan (' + APP_VERSION + ') yuqori qilsangiz, foydalanuvchilarda "Yangilash" paneli chiqadi.</p>' +
        '<button class="btn">Saqlash</button></form>';
    });
  } else {
    p = Promise.resolve('<form class="card" data-form="admcred"><b>Admin kirish ma\'lumotlari</b><p class="muted">Hozirgi telefon: ' + phoneFmt(u.phone) + '</p>' +
      '<label class="lbl" for="c-cp">Joriy parol</label><input id="c-cp" name="current_password" type="password" autocomplete="current-password" required>' +
      '<label class="lbl" for="c-ph">Yangi telefon raqam (o\'zgartirmasangiz bo\'sh qoldiring)</label><input id="c-ph" name="phone" inputmode="tel" placeholder="90 123 45 67" maxlength="20">' +
      '<label class="lbl" for="c-np">Yangi parol (kamida 8 belgi, bo\'sh qoldirsangiz o\'zgarmaydi)</label><input id="c-np" name="new_password" type="password" autocomplete="new-password" minlength="8">' +
      '<button class="btn">Saqlash</button></form>');
  }
  return p.then(function (body) {
    return {active: 'admin', title: 'Admin panel', wide: true, html: nav + body};
  });
}

function v404() {
  return {active: 'home', title: 'Topilmadi', back: '#/', html: emptyState('search', 'Sahifa topilmadi', "Manzil noto'g'ri yoki sahifa o'chirilgan.", '<a class="btn sm" href="#/">Bosh sahifa</a>')};
}

/* ============ SHAKL VA YO'NALTIRISH ============ */
var updHidden = false;
function navItems(u) {
  if (!u) return [['home', 'Bosh', '#/', 'home'], ['login', 'Kirish', '#/login', 'user'], ['register', "Ro'yxat", '#/register', 'plus']];
  if (u.role === 'admin') return [['admin', 'Admin', '#/admin', 'grid'], ['home', 'Ustalar', '#/', 'search'], ['profile', 'Profil', '#/profile', 'user']];
  if (u.role === 'master') return [['orders', 'Buyurtmalar', '#/orders', 'list'], ['home', 'Ustalar', '#/', 'search'], ['profile', 'Profil', '#/profile', 'user']];
  return [['home', 'Bosh', '#/', 'home'], ['orders', 'Buyurtmalar', '#/orders', 'list'], ['profile', 'Profil', '#/profile', 'user']];
}
function shell(v, u) {
  var upd = '';
  if (!updHidden && cmpVer(S.latest_version, APP_VERSION) > 0) {
    upd = '<div class="upd" role="status"><span class="t">Yangi versiya mavjud (' + esc(S.latest_version) + ')</span>' +
      (/^https?:\/\//.test(S.update_url) ? '<a class="go" href="' + esc(S.update_url) + '" target="_blank" rel="noopener">Yangilash</a>' : '<button class="go" data-act="reload">Yangilash</button>') +
      '<button class="x" data-act="updclose" aria-label="Yopish">' + ic('close', 18) + '</button></div>';
  }
  var bar = v.hideBar ? '' : '<header class="bar">' + (v.back ? '<a class="ib" href="' + v.back + '" aria-label="Orqaga">' + ic('back', 24) + '</a>' : '') + '<h1>' + esc(v.title || 'Mahalla') + '</h1></header>';
  var tabs = '<nav class="tabs"><div class="in">' + navItems(u).map(function (n) {
    return '<a href="' + n[2] + '" class="' + (n[0] === v.active ? 'on' : '') + '">' + ic(n[3], 24) + '<span>' + n[1] + '</span></a>';
  }).join('') + '</div></nav>';
  return upd + bar + '<main class="' + (v.flush ? 'flush' : '') + '">' + v.html + '</main>' + tabs;
}
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4200);
}
function need(u, roles, hash) {
  if (!u) return {redirect: '#/login?next=' + encodeURIComponent(hash), toast: 'Avval tizimga kiring.'};
  if (roles && roles.indexOf(u.role) < 0) return {redirect: '#/', toast: "Bu sahifaga ruxsat yo'q."};
  return null;
}
function route(seg, q, u, hash) {
  var g, a = seg[0] || '';
  if (a === '') return vHome(q, u);
  if (a === 'usta') return vMaster(+seg[1], u);
  if (a === 'order') { g = need(u, ['client'], hash); return g || vOrderForm(+seg[1]); }
  if (a === 'login') return u ? {redirect: homeFor(u)} : vLogin(q);
  if (a === 'register') return u ? {redirect: homeFor(u)} : vRegister(q);
  if (a === 'orders') { g = need(u, ['client', 'master'], hash); return g || vOrders(q, u); }
  if (a === 'profile') { g = need(u, null, hash); return g || vProfile(u); }
  if (a === 'delete') { g = need(u, ['client', 'master'], hash); return g || vDelete(); }
  if (a === 'admin') { g = need(u, ['admin'], hash); return g || vAdmin(seg[1] || 'stats', q, u); }
  if (a === 'privacy') return vPrivacy(u);
  return v404();
}
function homeFor(u) { return u && u.role === 'admin' ? '#/admin' : u && u.role === 'master' ? '#/orders' : '#/'; }

var rid = 0;
function render(silent) {
  var my = ++rid;
  var hash = location.hash || '#/', h = hash.slice(1), qi = h.indexOf('?');
  var path = qi < 0 ? h : h.slice(0, qi), q = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
  var seg = path.split('/').filter(Boolean);
  var appEl = document.getElementById('app');
  if (!silent) appEl.classList.add('loading');
  return me().then(function (u) {
    return Promise.resolve(route(seg, q, u, hash)).then(function (v) { return {v: v, u: u}; });
  }).then(function (r) {
    if (my !== rid) return;
    appEl.classList.remove('loading');
    var v = r.v;
    if (v.redirect) { if (v.toast) toast(v.toast); location.replace(v.redirect); return; }
    var y = window.scrollY;
    appEl.classList.toggle('wide', !!v.wide);
    appEl.innerHTML = shell(v, r.u);
    document.title = (v.title ? v.title + ' - ' : '') + 'Mahalla';
    if (silent) window.scrollTo(0, y);
  }).catch(function (e) {
    if (my !== rid) return;
    appEl.classList.remove('loading');
    if (e && e.server && /tizimga kiring|Ruxsat/.test(e.message)) { setTok(''); ME = null; location.replace('#/login'); return; }
    if (silent) return;
    appEl.classList.remove('wide');
    appEl.innerHTML = shell({active: 'home', title: 'Xatolik', back: '#/', html: emptyState(e && e.offline ? 'wifioff' : 'alert', e && e.offline ? "Internet yo'q" : 'Nimadir xato ketdi', esc(e && e.message || ''), '<button class="btn sm" data-act="retry">Qayta urinish</button>')}, ME);
  });
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

/* ============ AMALLAR ============ */
function afterLogin(u, next) { go(next && next.charAt(0) === '#' ? next : homeFor(u)); }
function fail(e) {
  if (e && e.server && /tizimga kiring/.test(e.message)) { setTok(''); ME = null; toast('Sessiya tugadi. Qayta kiring.'); go('#/login'); return; }
  toast(e && e.message ? e.message : 'Xatolik yuz berdi.');
}

function onForm(name, fd, ds) {
  var tok = getTok(), p;
  if (name === 'search') { go(hq({q: String(fd.get('q') || '').trim(), cat: fd.get('cat')})); return Promise.resolve(); }
  if (name === 'admusers') { go(hqa('users', {q: String(fd.get('q') || '').trim(), role: fd.get('role'), status: fd.get('status')})); return Promise.resolve(); }
  if (name === 'login') {
    return api('mhl_login', {p_phone: cleanPhone(fd.get('phone')), p_password: String(fd.get('password') || '')}).then(function (r) {
      if (!r || r.error) return toast(r && r.error ? r.error : 'Kirib bo\'lmadi.');
      setTok(r.token); ME = r.user; meAt = Date.now(); afterLogin(r.user, ds.next);
    });
  }
  if (name === 'register') {
    var role = fd.get('role') === 'master' ? 'master' : 'client', pr = toInt(fd.get('price'), 0, 0, 100000000);
    return api('mhl_register', {
      p_name: String(fd.get('name') || ''), p_phone: cleanPhone(fd.get('phone')), p_password: String(fd.get('password') || ''), p_role: role,
      p_category: role === 'master' ? String(fd.get('category') || '') : null, p_district: role === 'master' ? String(fd.get('district') || '') : null,
      p_price: role === 'master' ? pr : 0, p_about: role === 'master' ? String(fd.get('about') || '') : ''
    }).then(function (r) {
      setTok(r.token); ME = r.user; meAt = Date.now(); toast('Xush kelibsiz!'); afterLogin(r.user, ds.next);
    });
  }
  if (!tok) { toast('Avval tizimga kiring.'); return Promise.resolve(); }
  if (name === 'order') {
    return api('mhl_order_create', {p_token: tok, p_master: +ds.master, p_desc: String(fd.get('description') || ''), p_addr: String(fd.get('address') || ''), p_when: String(fd.get('when') || '')}).then(function () {
      toast('Buyurtma yuborildi. Usta tez orada javob beradi.'); go('#/orders');
    });
  }
  if (name === 'rate') {
    return api('mhl_order_rate', {p_token: tok, p_id: +ds.id, p_rating: toInt(fd.get('rating'), 5, 1, 5), p_review: String(fd.get('review') || '')}).then(function () { toast('Bahoyingiz uchun rahmat!'); go('#/orders?tab=history'); });
  }
  if (name === 'done') {
    return api('mhl_order_action', {p_token: tok, p_id: +ds.id, p_act: 'done', p_price: toInt(fd.get('price'), 0, 0, 100000000)}).then(function () { toast('Ish bajarildi deb belgilandi.'); go('#/orders?tab=history'); });
  }
  if (name === 'profile') {
    var np = String(fd.get('new_password') || '');
    return api('mhl_profile_update', {
      p_token: tok, p_name: String(fd.get('name') || ''), p_category: fd.get('category') ? String(fd.get('category')) : null, p_district: fd.get('district') != null ? String(fd.get('district')) : null,
      p_price: fd.get('price') ? toInt(fd.get('price'), 0, 0, 100000000) : null, p_about: fd.get('about') != null ? String(fd.get('about')) : null,
      p_current_password: np ? String(fd.get('current_password') || '') : null, p_new_password: np || null
    }).then(function (r) { ME = r; meAt = Date.now(); toast('Saqlandi.'); render(); });
  }
  if (name === 'delete') {
    return api('mhl_account_delete', {p_token: tok, p_password: String(fd.get('password') || '')}).then(function () {
      setTok(''); ME = null; toast("Akkauntingiz va shaxsiy ma'lumotlaringiz o'chirildi."); go('#/');
    });
  }
  if (name === 'report') {
    return api('mhl_report_create', {p_token: tok, p_kind: ds.kind, p_target: +ds.target, p_reason: String(fd.get('reason') || '')}).then(function () { toast("Shikoyat yuborildi. Tez orada ko'rib chiqamiz."); render(); });
  }
  if (name === 'admpw') {
    return api('mhl_admin_user_password', {p_token: tok, p_user: +ds.id, p_password: String(fd.get('password') || '')}).then(function () { toast('Parol yangilandi. Foydalanuvchi qayta kirishi kerak.'); render(); });
  }
  if (name === 'admsettings') {
    var cats = String(fd.get('categories') || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    return api('mhl_admin_settings_set', {p_token: tok, p_commission: toInt(fd.get('commission'), 10, 0, 50), p_contact_email: String(fd.get('contact_email') || ''), p_categories: cats, p_latest_version: String(fd.get('latest_version') || '').trim(), p_update_url: String(fd.get('update_url') || '').trim()}).then(function (s) {
      Object.keys(S).forEach(function (k) { if (s && s[k] != null) S[k] = s[k]; });
      try { CATS = JSON.parse(S.categories); } catch (e) {}
      toast('Sozlamalar saqlandi.'); render();
    });
  }
  if (name === 'admcred') {
    var nph = cleanPhone(fd.get('phone')), npw = String(fd.get('new_password') || '');
    if (!nph && !npw) { toast("O'zgartirish uchun yangi telefon yoki parol kiriting."); return Promise.resolve(); }
    return api('mhl_admin_credentials', {p_token: tok, p_current_password: String(fd.get('current_password') || ''), p_new_phone: nph || null, p_new_password: npw || null}).then(function (r) {
      ME = r; meAt = Date.now(); toast("Saqlandi. Keyingi kirishda yangi ma'lumotdan foydalaning."); render();
    });
  }
  return Promise.resolve();
}

function twoTap(btn, msg) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = msg;
  setTimeout(function () { if (document.body.contains(btn) && btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;
}

function onAct(act, ds, btn) {
  var tok = getTok(), done = function (msg, to) { if (msg) toast(msg); if (to) go(to); else render(); };
  if (act === 'logout') { return api('mhl_logout', {p_token: tok}).catch(function () {}).then(function () { setTok(''); ME = null; go('#/'); }); }
  if (act === 'reload') { location.reload(); return Promise.resolve(); }
  if (act === 'updclose') { updHidden = true; render(true); return Promise.resolve(); }
  if (act === 'retry') { render(); return Promise.resolve(); }
  if (!tok) { toast('Avval tizimga kiring.'); return Promise.resolve(); }
  if (act === 'avail') return api('mhl_available_toggle', {p_token: tok}).then(function (r) { return me(true).then(function () { done(r.available ? "Holat: hozir bo'shsiz." : 'Holat: hozir bandsiz. Yangi buyurtma kelmaydi.'); }); });
  if (act === 'accept' || act === 'cancel') {
    return api('mhl_order_action', {p_token: tok, p_id: +ds.id, p_act: act}).then(function () {
      if (act === 'accept') done('Buyurtma qabul qilindi.'); else done('Buyurtma bekor qilindi.', '#/orders?tab=history');
    });
  }
  if (act === 'ublock') return api('mhl_admin_user_block', {p_token: tok, p_user: +ds.id, p_blocked: ds.to === '1'}).then(function () { done(ds.to === '1' ? 'Foydalanuvchi bloklandi.' : 'Foydalanuvchi blokdan chiqarildi.'); });
  if (act === 'uhide') return api('mhl_admin_master_hide', {p_token: tok, p_user: +ds.id, p_hidden: ds.to === '1'}).then(function () { done(ds.to === '1' ? "E'lon yashirildi." : "E'lon ko'rsatildi."); });
  if (act === 'udel') {
    if (!twoTap(btn, "Tasdiqlash: yana bosing")) return Promise.resolve();
    return api('mhl_admin_user_delete', {p_token: tok, p_user: +ds.id}).then(function () { done("Akkaunt o'chirildi."); });
  }
  if (act === 'ocancel') {
    if (!twoTap(btn, 'Tasdiqlash: yana bosing')) return Promise.resolve();
    return api('mhl_admin_order_cancel', {p_token: tok, p_id: +ds.id}).then(function () { done('Buyurtma bekor qilindi.'); });
  }
  if (act === 'rblock' || act === 'rclear' || act === 'rclose') {
    var a = act === 'rblock' ? 'block' : act === 'rclear' ? 'clear' : 'close';
    return api('mhl_admin_report_action', {p_token: tok, p_id: +ds.id, p_action: a}).then(function () { done(a === 'block' ? 'Usta bloklandi.' : a === 'clear' ? "Sharh matni o'chirildi." : 'Shikoyat yopildi.'); });
  }
  return Promise.resolve();
}

var busy = false;
function guard(fn) {
  if (busy) return;
  busy = true;
  var p; try { p = fn(); } catch (e) { p = Promise.reject(e); }
  Promise.resolve(p).catch(fail).then(function () { busy = false; });
}
document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!f) return;
  e.preventDefault();
  var b = f.querySelector('button:not([type=button])');
  if (b) b.disabled = true;
  var name = f.getAttribute('data-form'), fd = new FormData(f), ds = f.dataset;
  guard(function () { return onForm(name, fd, ds); });
  setTimeout(function () { if (b && document.body.contains(b)) b.disabled = false; }, 1500);
});
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (b) { e.preventDefault(); guard(function () { return onAct(b.getAttribute('data-act'), b.dataset, b); }); }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.name === 'role') {
    var mf = document.getElementById('mf');
    if (mf) mf.classList.toggle('hide', e.target.value !== 'master');
  }
});
window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
setInterval(function () {
  var h = location.hash || '';
  if (document.hidden || !(h.indexOf('#/orders') === 0 || h.indexOf('#/admin') === 0)) return;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  render(true);
}, 25000);

loadSettings().then(function () { return render(); });
})();

</script>
</body></html>
